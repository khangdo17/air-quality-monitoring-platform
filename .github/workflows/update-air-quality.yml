name: Update Air Quality Data

on:
  schedule:
    # Hourly. Open-Meteo CAMS publishes 3-hourly steps twice a day, and the
    # Google Air Quality API is called only on even hours (see the script), so
    # a tighter schedule would re-fetch the same values and burn free-tier
    # calls for nothing.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: air-quality-ingestion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and store air quality/weather data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional. Without it the pipeline runs on Open-Meteo CAMS alone.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CITY_TIMEZONE: Asia/Bangkok
        run: python scripts/fetch_air_quality_weather.py
