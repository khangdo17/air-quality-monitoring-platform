name: Update Air Quality Data

on:
  schedule:
    # Hourly. Open-Meteo CAMS publishes 3-hourly steps twice a day, and the
    # Google Air Quality API (when enabled) is called only on even hours, so a
    # tighter schedule would re-fetch the same values and burn free-tier calls
    # for nothing.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: air-quality-ingestion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and store air quality/weather data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Google Air Quality is OFF. Terms of Service 3.2.3(e) forbids
          # using a Core Service "with or near a non-Google Map" and
          # /air-quality uses a custom Three.js map. See
          # docs/attribution-and-terms.md before changing this to "true";
          # the dashboard needs Google's attribution built first.
          GOOGLE_AQ_ENABLED: "false"
          # Ignored while the switch above is "false". No call is made.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CITY_TIMEZONE: Asia/Bangkok
        run: python scripts/fetch_air_quality_weather.py
